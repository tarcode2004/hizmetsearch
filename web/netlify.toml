# Netlify configuration for the HizmetSearch web app.
#
# This site uses MANUAL deploys via the Netlify CLI:
#   1. Build locally:    pnpm build           (from hizmetsearch/web/)
#   2. Push the bundle:  netlify deploy --prod --no-build --dir="$(pwd)/dist"
#
# There is no Git connection and Netlify never runs the build command on
# its servers. The `[build]` block below is preserved only as a fallback
# for the very rare `netlify deploy --build` invocation, but the
# canonical workflow is `--no-build`.
#
# Required Netlify env vars (Site configuration → Environment variables):
#   VITE_CONVEX_URL              — production Convex deployment URL
#   VITE_CLERK_PUBLISHABLE_KEY   — Clerk frontend API key
#   VITE_POSTHOG_KEY             — PostHog project API key (publishable)
#   VITE_POSTHOG_HOST            — https://us.i.posthog.com (or eu)

[build]
  # All paths in this block are relative to the toml's directory
  # (hizmetsearch/web/), so the build can run with the toml's parent as cwd
  # without needing the user to be in the repo root.
  publish = "dist"
  command = "pnpm install && pnpm build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# SPA fallback — every unmatched path serves index.html so React Router
# can handle the route client-side. Required for /chat, /search,
# /settings, /share/:token, /source/:docId etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
