<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HizmetSearch - İslami ilim kaynaklarında semantik arama ve yapay zeka destekli keşif" />
    <!-- Fonts are self-hosted via @fontsource (see src/main.tsx) -->
    <title>HizmetSearch — Semantic Search for Islamic Scholarship</title>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static form declarations for Netlify Forms.

      Netlify scans the BUILT static HTML for `<form netlify>` tags at
      deploy time and registers each form's name + field set on its
      side. Since we're a React SPA, the actual form is rendered by JS
      at runtime and is invisible to that scanner — so we declare a
      hidden copy of every form here. The runtime React form just
      POSTs to "/" with `form-name=<name>` and the matching field set.

      Keep field names in sync with src/components/feedback/.
    -->
    <form name="feedback" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="topic" />
      <textarea name="message"></textarea>
      <input type="text" name="page" />
      <input type="text" name="user_id" />
    </form>
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
